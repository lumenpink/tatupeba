name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          node --test
      - name: GOST Compliance Audit
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check
          fi
