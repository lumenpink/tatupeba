name: CI, Build & Sovereign CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  test:
    name: "JavaScript — Tests & Audit"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Node.js Tests"
        run: node --test

      - name: "Audit Sovereign CD Workflow"
        run: bash test/audit_cd_workflow.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish Tatupeba Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Version & Release Metadata"
        id: meta
        run: |
          RAW_VER=$(cat VERSION 2>/dev/null || node -p "require('./package.json').version")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +%Y%m%d)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            NIGHTLY_VER="${RAW_VER}-dev.${DATE_TAG}.${COMMIT_HASH}"
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "version=${NIGHTLY_VER}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: "Compile Multiarch Standalone Binaries"
        run: |
          mkdir -p dist/bin dist/packages
          npx --yes bun build --compile --target=bun-linux-x64 ./bin/tatupeba.js --outfile dist/bin/tatupeba-linux-amd64
          npx --yes bun build --compile --target=bun-linux-arm64 ./bin/tatupeba.js --outfile dist/bin/tatupeba-linux-arm64
          npx --yes bun build --compile --target=bun-windows-x64 ./bin/tatupeba.js --outfile dist/bin/tatupeba.exe
          cp dist/bin/tatupeba-linux-amd64 dist/bin/tatupeba
          chmod +x dist/bin/tatupeba*

      - name: "Package Release Bundles"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          tar -czvf "dist/packages/tatupeba-${VERSION}-linux-amd64.tar.gz" -C dist/bin tatupeba-linux-amd64
          tar -czvf "dist/packages/tatupeba-${VERSION}-linux-arm64.tar.gz" -C dist/bin tatupeba-linux-arm64
          cd dist/bin && zip -9 "../../dist/packages/tatupeba-${VERSION}-windows-amd64.zip" tatupeba.exe
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          upload_r2_with_retry() {
            local target="$1"
            local file="$2"
            local max_attempts=4
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Enviando $file para $target (tentativa $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$target" --file="$file" --remote; then
                echo "  ✓ Upload concluído com sucesso: $target"
                return 0
              fi
              echo "  ⚠️ Falha transitória ao enviar para o R2 (tentativa $attempt/$max_attempts). Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done

            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas ao publicar no Cloudflare R2: $target"
            exit 1
          }

          echo "★ Publicando pacotes versionados no R2 (twolp-bucket)..."
          for pkg in dist/packages/*; do
            [ -f "$pkg" ] || continue
            filename=$(basename "$pkg")
            upload_r2_with_retry "twolp-bucket/downloads/tatupeba/${CHANNEL}/${filename}" "$pkg"
          done

          echo "★ Publicando binários unificados em latest..."
          upload_r2_with_retry "twolp-bucket/downloads/tatupeba/${CHANNEL}-latest/tatupeba" dist/bin/tatupeba
          upload_r2_with_retry "twolp-bucket/downloads/tatupeba/${CHANNEL}-latest/tatupeba-linux-amd64" dist/bin/tatupeba-linux-amd64
          upload_r2_with_retry "twolp-bucket/downloads/tatupeba/${CHANNEL}-latest/tatupeba-linux-arm64" dist/bin/tatupeba-linux-arm64
          upload_r2_with_retry "twolp-bucket/downloads/tatupeba/${CHANNEL}-latest/tatupeba.exe" dist/bin/tatupeba.exe

      - name: "Update & Rotate Release Manifest in Banca Repo"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$GIT_2LP_TOKEN" ]; then
            echo "Aviso: GIT_2LP_TOKEN ausente. Pulando rotação na Banca."
            exit 0
          fi

          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/tatupeba" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="tatupeba-${VERSION}-${ARCH}.${EXT}"
              HASH=$(sha256sum "$GITHUB_WORKSPACE/dist/packages/$PKG_FILE" 2>/dev/null | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://banca.2lp.in/downloads/tatupeba/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/tatupeba/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "tatupeba"
            done

            git config user.name "Tatupeba Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/tatupeba/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate tatupeba release to ${VERSION} (#2)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já se encontra atualizado na Banca."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obitwo)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          docker build -t lumenpink/tatupeba:latest -f ./Dockerfile .

      - name: "Login to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: "Push Image to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          docker push lumenpink/tatupeba:latest

      - name: "Deploy Remotely to obitwo (Tailscale / SSH)"
        env:
          OBITWO_SSH_HOST: ${{ secrets.OBITWO_SSH_HOST || '100.90.43.39' }}
          OBITWO_SSH_USER: ${{ secrets.OBITWO_SSH_USER || 'ubuntu' }}
          OBITWO_SSH_KEY: ${{ secrets.OBITWO_SSH_KEY }}
        run: |
          echo "-> Iniciando deploy soberano no nó de borda obitwo ($OBITWO_SSH_HOST)..."
          if [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -n "$OBITWO_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$OBITWO_SSH_KEY" > /tmp/id_ci_obitwo
            chmod 600 /tmp/id_ci_obitwo
            SSH_OPTS="-i /tmp/id_ci_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$OBITWO_SSH_USER@$OBITWO_SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/tatupeba
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' lumenpink/tatupeba:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Puxando nova imagem lumenpink/tatupeba:latest no obitwo...'
            docker compose pull tatupeba
            docker compose up -d --no-build tatupeba

            echo '-> Validando estabilidade (healthcheck polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' tatupeba 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container tatupeba saudável e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container tatupeba não estabilizou no obitwo! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" lumenpink/tatupeba:latest
                docker compose up -d --no-build tatupeba
                echo '✔ Rollback concluído no obitwo.'
              fi
              exit 1
            fi

            echo '-> Limpando camadas órfãs no obitwo...'
            docker image prune -f
          "
